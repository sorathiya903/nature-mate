
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Grass Challenge Game</title>
    <style>
        :root {
            --primary: #2e7d32;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 { margin-top: 0; font-size: 24px; color: var(--primary); }

        /* Progress Step Styling */
        #loading-screen { width: 100%; margin: 20px 0; }
        
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 12px;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.1s linear;
        }

        #data-counter { font-size: 14px; color: #666; font-weight: 500; }

        /* Elegant Circular Camera View (Initially Hidden) */
        #game-screen { display: none; width: 100%; }

        .camera-wrapper {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            margin: 20px auto;
            border: 6px solid var(--primary);
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.2);
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #task-box {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            margin: 15px 0;
            border-left: 5px solid var(--primary);
        }

        .btn {
            padding: 14px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
            transition: all 0.2s ease;
            width: 80%;
        }
        .btn:active { transform: scale(0.98); }

        #status-message {
            margin-top: 15px;
            font-size: 15px;
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌿 Context Shift</h1>

        <!-- Setup Step: Loading & Progress -->
        <div id="loading-screen">
            <p id="step-title">Initializing Game Systems...</p>
            <div class="progress-container">
                <div id="bar" class="progress-bar"></div>
            </div>
            <p id="data-counter">0.00 MB / ~30 MB (0%)</p>
        </div>

        <!-- Gameplay Step: Camera Flow -->
        <div id="game-screen">
            <div id="task-box">Loading your quest...</div>
            <div class="camera-wrapper">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <button class="btn" id="capture-btn">📸 Capture & Verify</button>
            <p id="status-message">Scan your surroundings!</p>
        </div>
    </div>

    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';

        const loadingScreen = document.getElementById('loading-screen');
        const gameScreen = document.getElementById('game-screen');
        const stepTitle = document.getElementById('step-title');
        const progressBar = document.getElementById('bar');
        const dataCounter = document.getElementById('data-counter');
        const taskBox = document.getElementById('task-box');
        const video = document.getElementById('webcam');
        const captureBtn = document.getElementById('capture-btn');
        const statusMessage = document.getElementById('status-message');

        let detectorInstance = null;
        let currentTarget = "";
        
        // Dynamic target selection pool 
        const taskPool = ["tree", "banner", "street light", "car", "bench", "bicycle"];
        // Tracking metrics for individual file chunks fetched via HuggingFace
        const fileSizes = {}; 

        // 1. Core Download Engine with Live MB Progress Tracking
        async function loadModel() {
            stepTitle.innerText = "Downloading Local Computer Vision Model...";

            try {
                // Initializing a fast, lightweight 30MB Object detection model
                detectorInstance = await pipeline('zero-shot-object-detection', 'Xenova/resnet-50_computervision_attack', {
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            // Save file chunks to calculate total megabytes downloaded
                            fileSizes[data.file] = { 
                                loaded: data.loaded || 0, 
                                total: data.total || 0 
                            };
                            
                            let totalLoadedBytes = 0;
                            let totalFileBytes = 0;

                            for (const file in fileSizes) {
                                totalLoadedBytes += fileSizes[file].loaded;
                                totalFileBytes += fileSizes[file].total;
                            }

                            // Convert values safely to MB metrics
                            const loadedMB = (totalLoadedBytes / (1024 * 1024)).toFixed(2);
                            const totalMB = (totalFileBytes / (1024 * 1024)).toFixed(2);
                            const percentage = data.progress ? Math.round(data.progress) : 0;

                            progressBar.style.width = `${percentage}%`;
                            dataCounter.innerText = `${loadedMB} MB / ~${totalMB} MB (${percentage}%)`;
                        }
                        if (data.status === 'ready') {
                            progressBar.style.width = '100%';
                            dataCounter.innerText = "Assets cached and ready!";
                        }
                    }
                });

                // Move directly to verification step
                requestCameraAccess();

            } catch (error) {
                console.error(error);
                stepTitle.innerText = "Error loading model. Check internet connectivity.";
            }
        }

        // 2. Sequential Access Step: Requesting camera hardware permissions
        async function requestCameraAccess() {
            stepTitle.innerText = "Opening camera array...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: 400, height: 400 }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                // Switch interface directly to live game screen
                loadingScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                generateRandomTask();

            } catch (err) {
                alert("Camera access is mandatory to play this physical location puzzle game!");
                stepTitle.innerText = "Camera Permission Denied.";
            }
        }

        // 3. Selection Gameplay Rule
        function generateRandomTask() {
            const randomIndex = Math.floor(Math.random() * taskPool.length);
            currentTarget = taskPool[randomIndex];
            taskBox.innerHTML = `Current Objective: Find a <strong>${currentTarget.toUpperCase()}</strong> outside!`;
            statusMessage.innerText = "Point your lens directly at it.";
            statusMessage.style.color = "var(--text)";
        }

        // 4. Verification engine using internal canvas snapshots
        captureBtn.addEventListener('click', async () => {
            statusMessage.innerText = "Local AI scanning pixels...";
            statusMessage.style.color = "#d97706";

            // Snap active context frame directly from raw video track
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageBlobUrl = canvas.toDataURL('image/jpeg');

            try {
                // Pass candidates list straight to local neural engine
                const predictions = await detectorInstance(imageBlobUrl, taskPool);
                console.log("AI Arrays:", predictions);

                // Check if target is present with confidence exceeding 45%
                const match = predictions.find(item => item.label === currentTarget && item.score > 0.45);

                if (match) {
                    statusMessage.innerText = `🎉 Target Confirmed! You Won! (${Math.round(match.score * 100)}% match)`;
                    statusMessage.style.color = "var(--primary)";
                    

// Proceed to next level after 3 seconds
setTimeout(() => {
generateRandomTask();
}, 3500);
} else {
statusMessage.innerText = ❌ No ${currentTarget} detected here. Try matching angles or lighting!;
statusMessage.style.color = "#dc2626";
}
} catch (err) {
console.error(err);
statusMessage.innerText = "Processing pipeline exception occurred.";
}
});
// Initialize execution setup loop on boot
loadModel();

</script>
</body>
</html>
